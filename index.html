<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cry Link AI | Official Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Cry Link AI Brand Colors */
            --bg-gradient: radial-gradient(circle at top right, #2e1065, #0f172a);
            --card-bg: rgba(30, 41, 59, 0.4);
            --accent-color: #d946ef; /* Magenta */
            --accent-gradient: linear-gradient(135deg, #3b82f6, #d946ef);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 60px 0;
        }

        .container {
            max-width: 650px;
            width: 90%;
            text-align: center;
        }

        /* App Icon */
        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            margin: 0 auto 32px;
            display: block;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(217, 70, 239, 0.3);
            border: 1px solid var(--border-color);
            background: #fff;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        /* Marketing Text Section */
        .hero-text {
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 36px;
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            padding: 32px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(4px);
        }

        .hero-text span {
            color: var(--accent-color);
            font-weight: 700;
        }

        /* Hero App Store Download CTA Button */
        .download-cta-container {
            margin-bottom: 56px;
        }

        .btn-download-appstore {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--accent-gradient);
            color: #ffffff;
            padding: 20px 48px;
            border-radius: 50px;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(217, 70, 239, 0.5), 0 0 20px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 480px;
        }

        .btn-download-appstore:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(217, 70, 239, 0.7), 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .btn-download-appstore svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Subordinate Links (Privacy / Terms / Contact) Section */
        .sub-links-section {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 36px;
            margin-top: 20px;
        }

        /* Subtle Nav Links */
        .nav-grid-subtle {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .subtle-link {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition);
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .subtle-link:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Subtle Contact Link */
        .contact-container {
            margin-top: 12px;
        }

        .btn-support-subtle {
            color: var(--text-sub);
            font-size: 0.85rem;
            text-decoration: none;
            transition: var(--transition);
            opacity: 0.7;
        }

        .btn-support-subtle:hover {
            color: var(--text-main);
            opacity: 1;
            text-decoration: underline;
        }

        footer {
            margin-top: 48px;
            color: var(--text-sub);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .hero-text { font-size: 0.95rem; padding: 24px; }
            .btn-download-appstore { font-size: 1.05rem; padding: 16px 24px; }
            .app-icon { width: 100px; height: 100px; }
            .nav-grid-subtle { gap: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <img src="icon.png" alt="Cry Link AI Icon" class="app-icon">
    
    <h1>Cry Link AI</h1>
    
    <!-- アプリ説明 -->
    <div class="hero-text">
        言葉にならない赤ちゃんの泣き声。AIがその<span>心の声を「翻訳」</span>し、パパとママの毎日をサポートします。最新の音声解析技術で、お腹が空いた、眠い、不快といったニーズを瞬時に特定。<span>「なぜ泣いているかわからない」不安を安心に変え</span>、家族の笑顔をつなぐ、次世代の育児体験をiPhoneから。
    </div>

    <!-- App Store 無料ダウンロードボタン (最重要コンテンツとして大きく配置) -->
    <div class="download-cta-container">
        <a href="https://apps.apple.com/jp/app/cry-link-ai-%E8%B5%A4%E3%81%A1%E3%82%83%E3%82%93%E3%81%AE%E6%B3%A3%E3%81%8D%E5%A3%B0%E8%A7%A3%E6%9E%90/id6767391583" class="btn-download-appstore" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 384 512" aria-hidden="true">
                <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 52.3-12 69.5-34.3z"/>
            </svg>
            App Storeで無料ダウンロード
        </a>
    </div>

    <!-- 控えめにした規約・ポリシー・問い合わせエリア -->
    <div class="sub-links-section">
        <nav class="nav-grid-subtle">
            <a href="./privacypolicy/" class="subtle-link">プライバシーポリシー</a>
            <a href="./terms-of-service/" class="subtle-link">利用規約</a>
        </nav>

        <div class="contact-container">
            <a href="https://forms.gle/ixwZjPgU2AUTeAM96" class="btn-support-subtle" target="_blank" rel="noopener noreferrer">
                お問い合わせ・フィードバック
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Teppei Uomi. All rights reserved.
    </footer>
</div>

</body>
</html>
